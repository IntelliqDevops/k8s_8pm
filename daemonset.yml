---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wordpress-ds
  labels:
    app: website
    author: intelliqit
spec:
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      name: wordpress-pod
      labels:
        app: website
    spec:
      containers:
        - name: mywordpress
          image: wordpress
          ports:
            - containerPort: 80
              hostPort: 9090
...

